<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18c1d8" />
  <title>choice</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-64.png?v=79" />
  <link rel="apple-touch-icon" href="icon-180.png?v=79" />
  <link rel="stylesheet" href="vendor/fonts/ubuntu.css?v=79" />
  <link rel="stylesheet" href="styles.css?v=79" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img class="brand-logo grow" src="logo.png?v=79" alt="choice" /><img class="brand-mark" src="logo-mark.png?v=79" alt="choice" /><button id="notifBell" class="notif-bell" title="Notifications"></button><button id="sideToggle" class="side-toggle" title="Replier le menu"></button></div>
      <!-- éléments de navigation injectés par app.js -->
      <div class="drivebar" id="driveBar"></div>
    </aside>
    <main class="content" id="content">
      <!-- contenu injecté par app.js -->
    </main>
  </div>

  <nav class="tabbar" id="tabbar"><!-- onglets mobiles injectés --></nav>

  <div class="install-banner" id="installBanner">
    <div class="grow">
      <strong>Installer choice</strong>
      <div class="muted" style="font-size:13px">Ajoutez l'app à votre écran d'accueil / bureau.</div>
    </div>
    <button class="btn small" id="installBtn">Installer</button>
    <button class="btn ghost small" id="installClose">✕</button>
  </div>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="config.js?v=79"></script>
  <script src="drive.js?v=79"></script>
  <script src="app.js?v=79"></script>
  <script>
    // Enregistrement du service worker (hors ligne + installation)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
